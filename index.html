<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXOTIC CLUB — Verified TikTok & Instagram Trading</title>
<meta name="description" content="EXOTIC CLUB — নিরাপদ ও ভেরিফাইড TikTok / Instagram একাউন্ট কেনাবেচার কমিউনিটি।" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💚</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">

  <!-- notice pill -->
  <div class="notice-pill glass pill">
    <span class="dot"></span>
    <span class="txt" id="noticeText">লোড হচ্ছে...</span>
  </div>

  <!-- brand -->
  <div class="brand">
    <div class="brand-logo">EXOTIC CLUB</div>
    <div class="brand-tag">verified · secure · trusted trading</div>
  </div>

  <!-- main action buttons -->
  <div class="action-stack" id="actionStack">

    <a href="guid.html" class="main-btn btn-guide glass pill">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      <span class="label-block">
        <small>read first</small>
        Secret Guideline
      </span>
      <span class="chev">›</span>
    </a>

    <a href="sec.html" class="main-btn btn-secret glass pill">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 5 4h3L6 8.5"/><path d="M9 8.5 11 4h3l-2 4.5"/><path d="M15 8.5 17 4h2l1 4.5"/><rect x="3" y="8.5" width="18" height="11.5" rx="2"/></svg>
      </span>
      <span class="label-block">
        <small>insider access</small>
        Secret Workflow
      </span>
      <span class="chev">›</span>
    </a>

    <a href="course.html" class="main-btn btn-course glass pill">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/><path d="M22 8v6"/></svg>
      </span>
      <span class="label-block">
        <small>learn &amp; earn</small>
        Editing Course
      </span>
      <span class="chev">›</span>
    </a>

    <div class="buysell-wrap">
      <button class="main-btn btn-buysell glass pill" id="btnBuySell" type="button">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-4"/><path d="M20 16H7l3 4"/></svg>
        </span>
        <span class="label-block">
          <small>marketplace</small>
          Buy / Sell
        </span>
        <span class="chev">›</span>
      </button>

      <div class="submenu" id="buySellSubmenu">
        <div class="submenu-pill">
          <button class="sub-btn buy" id="btnBuy" type="button">
            <span class="sub-dot buy-dot"></span> BUY
          </button>
          <span class="submenu-divider"></span>
          <button class="sub-btn sell" id="btnSell" type="button">
            <span class="sub-dot sell-dot"></span> SELL
          </button>
        </div>
      </div>
    </div>

    <button class="main-btn btn-report glass pill" id="btnReport" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg>
      </span>
      <span class="label-block">
        <small>help us stay safe</small>
        অভিযোগ বক্স
      </span>
      <span class="chev">›</span>
    </button>

  </div>

  <!-- reviews -->
  <div class="reviews-section">
    <div class="reviews-track" id="reviewsTrack"></div>
  </div>

  <div class="site-footer">
    EXOTIC CLUB © <span id="year"></span> — built &amp; maintained by Fahim Hasan Joy · <a href="admin.html">admin</a>
  </div>

</div>

<!-- complaint floating box -->
<div class="overlay-scrim" id="scrim"></div>
<div class="complaint-box glass" id="complaintBox">
  <div class="complaint-title">অভিযোগ পাঠান</div>

  <div class="field-row">
    <div class="field" id="fieldName">
      <label>Name</label>
      <input type="text" placeholder="আপনার নাম" />
    </div>
    <div class="field" id="fieldDate">
      <label>Date</label>
      <input type="date" />
    </div>
  </div>

  <div class="field" id="fieldType">
    <label>Type</label>
    <div class="type-chips">
      <button type="button" class="type-chip" data-type="Photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
        Photo
      </button>
      <button type="button" class="type-chip" data-type="Video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 5 4h3L6 8.5"/><path d="M9 8.5 11 4h3l-2 4.5"/><path d="M15 8.5 17 4h2l1 4.5"/><rect x="3" y="8.5" width="18" height="11.5" rx="2"/></svg>
        Video
      </button>
      <button type="button" class="type-chip" data-type="Person">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
        Person
      </button>
      <button type="button" class="type-chip" data-type="Others">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M5 8l14 8M19 8 5 16"/></svg>
        Others
      </button>
    </div>
  </div>

  <div class="field" id="fieldMsg">
    <label>মূল বিষয়</label>
    <textarea placeholder="বিস্তারিত লিখুন..."></textarea>
  </div>

  <button type="button" class="anon-toggle" id="anonToggle">◎ report anonymously</button>

  <div class="complaint-actions">
    <button type="button" class="btn-send pill" id="btnSendReport">পাঠান</button>
    <button type="button" class="btn-cancel pill" id="btnCancelReport">বাতিল</button>
  </div>
  <div class="form-note">সকল রিপোর্ট এডমিন পেইজে সরাসরি জমা হয়</div>
</div>

<div class="toast pill" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script src="main.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
